<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0e1410">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Verdant</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;}
body{
  background:#0e1410;color:#e8ece6;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  display:flex;justify-content:center;user-select:none;
}
#app{
  --action-height:60px;
  position:relative;width:100%;max-width:440px;height:100dvh;
  display:flex;flex-direction:column;background:#0e1410;overflow:hidden;
}
#growth-panel{
  position:absolute;z-index:3;left:0;right:0;top:0;
  height:calc(env(safe-area-inset-top) + 60px);
  background:#24352b;border-bottom:1px solid #35493c;
  pointer-events:none;
}
#stage{position:absolute;inset:0;z-index:1;}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;}
#bottom{position:absolute;left:0;right:0;bottom:0;z-index:3;padding:0 18px calc(env(safe-area-inset-bottom) + 18px);}
#action{
  width:100%;min-height:var(--action-height);line-height:22px;border:none;border-radius:12px;padding:19px;
  font-family:inherit;font-size:17px;font-weight:600;letter-spacing:.3px;
  color:#11200c;background:#8fc748;cursor:pointer;transition:transform .08s;
}
#action:active{transform:scale(.985);}
#action.stop{color:#2a1410;background:#e8a447;}
#action:disabled{filter:grayscale(.5) brightness(.7);cursor:default;}
#fs{
  position:absolute;z-index:5;
  top:calc(env(safe-area-inset-top) + 12px);right:12px;
  width:36px;height:36px;border:none;border-radius:11px;
  background:rgba(255,255,255,0.07);color:#9aa694;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
}
#fs svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
#fs.hidden{display:none;}
#lose{
  position:absolute;z-index:5;
  top:calc(env(safe-area-inset-top) + 12px);left:12px;
  height:36px;padding:0 13px;border:none;border-radius:11px;
  background:rgba(255,255,255,0.07);color:#9aa694;
  font-family:inherit;font-size:12px;letter-spacing:.4px;cursor:pointer;
}
#lose:disabled{opacity:.35;cursor:default;}
</style>
</head>
<body>
<div id="app">
  <button id="lose">проигрыш</button>
  <button id="fs" aria-label="На весь экран">
    <svg viewBox="0 0 24 24"><path id="fsIcon" d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
  </button>
  <div id="stage"><canvas id="cv"></canvas></div>
  <div id="growth-panel" aria-hidden="true"></div>
  <div id="bottom"><button id="action">Посадить</button></div>
</div>

<script>
(function(){
  var canvas=document.getElementById('cv');
  var ctx=canvas.getContext('2d');
  var actionBtn=document.getElementById('action');
  var stage=document.getElementById('stage');

  var stemColor=[77,138,30], branchColor=[77,138,30], budColor=[184,217,122];
  var stemCss='rgb(77,138,30)', branchCss='rgb(77,138,30)';
  var deadStem=[166,132,88], deadBranch=[166,132,88], deadBud=[184,151,91];

  /* ---- параметры ---- */
  var MAX_BRANCHES=22;                       /* предохранитель, не рабочий регулятор */
  /* Leaf maturity follows its own age, independent of the viewport or camera. */
  var LEAF_SMALL=0.46,LEAF_LARGE=1.15;
  var OLD_LEAF_BOOST=0.35; // Oldest foliage gains another 35% in linear size.
  var MAX_LOWER_BRANCHES=10;
  // Editable leaf palette: young -> growing -> nearly mature -> mature.
  var LEAF_PALETTE=['#8AAF62','#80B954','#609C32','#5B602D'];
  // Vertical stem advance since this shoot was born, in fixed scene heights.
  // Hold young green first; reserve olive for the last part of the visible journey.
  var LEAF_COLOR_STOPS=[0.12,0.38,0.65,0.88];
  var LEAF_COLORS=LEAF_PALETTE.map(function(hex){
    return [parseInt(hex.slice(1,3),16),parseInt(hex.slice(3,5),16),parseInt(hex.slice(5,7),16)];
  });
  var SPAWN_GAP_MIN=0.058, SPAWN_GAP_MAX=0.092;  /* интервал между ветками, доли высоты */
  var SPAWN_LAG_FRAC=0.045;                  /* отступ точки крепления от кончика */
  // World units stay fixed across viewport changes. 0.65 preserves the
  // approximate visual pace of the old 60 Hz path after correcting its spacing.
  var SPEED_FRAC=0.0029*0.65;
  var FIXED_STEP=1/60;
  var lastTime=0,stepAccum=0,hiddenAt=null;
  var CAMERA_FRAC=0.055; // Small gap above the growing bud; bloom gets its own clearance.
  var STEP_PX=1.0, MAX_TURN=0.030;

  var CW=402,CH=700,DPR=1;
  var CAMERA_TRIGGER_Y,REVEAL_SPEED,SPAWN_LAG_PX,START;

  var fullPath,revealIndex,revealAccum,nextSpawnAt,grownPx;
  var branches,drawStart,cameraY,cameraActive,segmentCount,lastBranchSide,waveSign,sideMass,sameRun;
  var mode,witherT;
  var dryStem,dryBranches,dryHold;
  // Tune the whole loss gesture with one duration; the result hold is independent.
  var WITHER_DURATION_SECONDS=1.4;
  var WITHER_HOLD_SECONDS=0.5;
  var bloomStem,bloomBranches,bloomT,bloomHold;
  var rafId=null,rng=Math.random;

  function stopLoop(){if(rafId!==null){cancelAnimationFrame(rafId);rafId=null;}}
  function startLoop(){stopLoop();lastTime=performance.now();stepAccum=0;rafId=requestAnimationFrame(tick);}

  function resize(){
    DPR=Math.min(2,window.devicePixelRatio||1);
    var vw=stage.clientWidth,vh=stage.clientHeight;
    if(vw<=0||vh<=0) return;
    canvas.width=Math.round(vw*DPR);canvas.height=Math.round(vh*DPR);
    // The plant always grows in the same 402 x 700 world; resize only projects it.
    ctx.setTransform(canvas.width/CW,0,0,canvas.height/CH,0,0);
    var mw=document.getElementById('growth-panel');
    var mb=mw.getBoundingClientRect().bottom-stage.getBoundingClientRect().top;
    CAMERA_TRIGGER_Y=Math.max(CH*0.06,mb/vh*CH+CH*CAMERA_FRAC);
    REVEAL_SPEED=CH*SPEED_FRAC;
    SPAWN_LAG_PX=CH*SPAWN_LAG_FRAC;
    START={x:CW*0.24,y:CH*0.90};
    if(!fullPath) resetState();
    if(cameraActive) cameraY=fullPath[revealIndex].y-CAMERA_TRIGGER_Y;
    draw();
  }

  function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
  function lerpC(a,b,t){return 'rgb('+Math.round(a[0]+(b[0]-a[0])*t)+','+Math.round(a[1]+(b[1]-a[1])*t)+','+Math.round(a[2]+(b[2]-a[2])*t)+')';}
  function lerpAngle(a,b,t){var d=b-a;while(d>Math.PI)d-=Math.PI*2;while(d<-Math.PI)d+=Math.PI*2;return a+d*t;}
  function clampUpward(ang,minUp){
    var dx=Math.cos(ang),dy=Math.sin(ang);
    if(dy>-minUp){dy=-minUp;var m=Math.sqrt(Math.max(0.0001,1-dy*dy));dx=(dx>=0?1:-1)*m;}
    return Math.atan2(dy,dx);}

  /* ---- построение пути ---- */
  function crPoint(p0,p1,p2,p3,t){var t2=t*t,t3=t2*t;return{
    x:0.5*((2*p1.x)+(-p0.x+p2.x)*t+(2*p0.x-5*p1.x+4*p2.x-p3.x)*t2+(-p0.x+3*p1.x-3*p2.x+p3.x)*t3),
    y:0.5*((2*p1.y)+(-p0.y+p2.y)*t+(2*p0.y-5*p1.y+4*p2.y-p3.y)*t2+(-p0.y+3*p1.y-3*p2.y+p3.y)*t3)};}

  function sampleSpline(ctrl,phantom,per){
    var pad=[phantom].concat(ctrl,[ctrl[ctrl.length-1]]),out=[];
    for(var i=0;i<ctrl.length-1;i++){for(var s=0;s<per;s++){out.push(crPoint(pad[i],pad[i+1],pad[i+2],pad[i+3],s/per));}}
    out.push(ctrl[ctrl.length-1]);return out;}

  function resampleUniform(pts,step){
    if(pts.length<2) return pts;
    var out=[{x:pts[0].x,y:pts[0].y}],remaining=step;
    for(var i=1;i<pts.length;i++){
      var a=pts[i-1],b=pts[i],dx=b.x-a.x,dy=b.y-a.y;
      var length=Math.hypot(dx,dy);
      if(length<1e-9) continue;
      var used=0;
      while(length-used>=remaining-1e-9){
        used=Math.min(length,used+remaining);
        out.push({x:a.x+dx*used/length,y:a.y+dy*used/length});
        remaining=step;
      }
      remaining-=length-used;
    }
    return out;}

  function walkGuided(pts,maxTurn){
    if(pts.length<3) return pts;
    var margin=CW*0.16;
    var selfR=CH*0.075;
    var tailLo=Math.max(0,fullPath.length-Math.round(CH*1.1));
    var out=[pts[0]],cx=pts[0].x,cy=pts[0].y;
    var ang=Math.atan2(pts[1].y-pts[0].y,pts[1].x-pts[0].x);
    for(var i=1;i<pts.length;i++){
      var d=Math.hypot(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y);
      if(d<1e-6) continue;
      var want=Math.atan2(pts[i].y-cy,pts[i].x-cx);
      var sx=0,sy=0;
      for(var j=tailLo;j<fullPath.length-Math.round(CH*0.16);j+=9){
        var q=fullPath[j],qdx=cx-q.x,qdy=cy-q.y,qd=Math.hypot(qdx,qdy);
        if(qd<selfR&&qd>0.01){var qf=1-qd/selfR;sx+=(qdx/qd)*qf;sy+=(qdy/qd)*qf;}
      }
      for(var m=0;m<out.length-Math.round(CH*0.16);m+=9){
        var o=out[m],odx=cx-o.x,ody=cy-o.y,od=Math.hypot(odx,ody);
        if(od<selfR&&od>0.01){var of=1-od/selfR;sx+=(odx/od)*of;sy+=(ody/od)*of;}
      }
      if(sx||sy) want=lerpAngle(want,Math.atan2(sy,sx),Math.min(0.55,Math.hypot(sx,sy)*0.30));
      var edge=0;
      if(cx<margin) edge=Math.min(1,(margin-cx)/margin);
      else if(cx>CW-margin) edge=-Math.min(1,(cx-(CW-margin))/margin);
      if(edge!==0){
        var away=edge>0?-Math.PI*0.32:-Math.PI*0.68;
        want=lerpAngle(want,away,Math.abs(edge)*0.85);
      }
      want=clampUpward(want,0.14);
      var diff=want-ang;
      while(diff>Math.PI)diff-=Math.PI*2;
      while(diff<-Math.PI)diff+=Math.PI*2;
      diff=Math.max(-maxTurn,Math.min(maxTurn,diff));
      ang+=diff;
      cx+=Math.cos(ang)*d;cy+=Math.sin(ang)*d;
      cx=Math.max(CW*0.06,Math.min(CW*0.94,cx));
      out.push({x:cx,y:cy});
    }
    return out;}

  function smoothPts(pts,iters){
    var a=pts.slice();
    for(var k=0;k<iters;k++){
      var b=[a[0]];
      for(var i=1;i<a.length-1;i++) b.push({x:(a[i-1].x+a[i].x*2+a[i+1].x)/4,y:(a[i-1].y+a[i].y*2+a[i+1].y)/4});
      b.push(a[a.length-1]);a=b;
    }
    return a;}

  function tangentPhantom(){
    if(fullPath.length<40){var sp=fullPath.length?fullPath[fullPath.length-1]:START;return{x:sp.x,y:sp.y+180};}
    var a=fullPath[fullPath.length-1],b=fullPath[fullPath.length-40];
    var dx=a.x-b.x,dy=a.y-b.y,d=Math.hypot(dx,dy)||1;
    return{x:a.x-(dx/d)*180,y:a.y-(dy/d)*180};}

  function extendMainPath(){
    var isFirst=fullPath.length===0;
    var startPt=isFirst?START:fullPath[fullPath.length-1];
    var rise=(isFirst?0.46:0.38+rng()*0.16)*CH;
    var targetX=isFirst?CW*(0.58+rng()*0.18):CW*(0.26+rng()*0.48);
    var targetPt={x:targetX,y:startPt.y-rise};
    var growth=Math.min(1,segmentCount/2);
    var numW=2;
    var dx=targetPt.x-startPt.x,dy=targetPt.y-startPt.y,dist=Math.hypot(dx,dy)||1;
    var spacing=dist/(numW+1),perpX=-(dy/dist),perpY=dx/dist;
    var ampCap=spacing*(0.32+growth*0.30);
    var ctrl=[startPt];
    for(var i=1;i<=numW;i++){
      var t=i/(numW+1),depth=0.62+rng()*0.38;
      var amp=ampCap*depth*(0.55+growth*0.45);
      waveSign=-waveSign;
      if(rng()<0.15) waveSign=-waveSign;
      ctrl.push({x:Math.max(CW*0.13,Math.min(CW*0.87,startPt.x+dx*t+perpX*amp*waveSign)),y:startPt.y+dy*t+perpY*amp*waveSign});
    }
    ctrl.push(targetPt);
    var uni=resampleUniform(smoothPts(walkGuided(resampleUniform(sampleSpline(ctrl,tangentPhantom(),150),STEP_PX),MAX_TURN),3),STEP_PX);
    fullPath=fullPath.concat(isFirst?uni:uni.slice(1));
    segmentCount++;}

  /* ---- ветки ---- */
  function buildBranchPath(originIdx,side,center){
    var o=fullPath[originIdx];
    // One direction defines the petiole and its leaf: no independent rotation.
    var tilt=(center?45+rng()*20:35+rng()*35)*Math.PI/180;
    var angle=side>0?-tilt:-Math.PI+tilt;
    var length=CH*(center?0.014+rng()*0.006:0.020+rng()*0.009);
    var pts=[],ca=Math.cos(angle),sa=Math.sin(angle);
    for(var i=0;i<=32;i++){
      var t=i/32;
      // A soft bend at the root, with the final quarter straight into the vein.
      var u=Math.min(1,t/0.75),bend=Math.sin(Math.PI*u)*Math.sin(Math.PI*u)*CH*0.002*side;
      pts.push({x:o.x+ca*length*t-sa*bend,y:o.y+sa*length*t+ca*bend});
    }
    return pts;
  }

  function pickBranchSide(){
    var top=[0,0];
    for(var i=0;i<branches.length;i++){
      var b=branches[i];
      var sy=b.pts[0].y-cameraY;
      if(sy>CH*0.62) continue;               /* только верхние две трети кадра */
      top[b.bside>0?1:0]+=b.mass;
    }
    var diff=top[1]-top[0];
    var s;
    if(Math.abs(diff)>0.45) s=diff>0?-1:1;
    else { s=-lastBranchSide; if(rng()<0.12) s=-s; }
    if(s===lastBranchSide){ sameRun++; } else { sameRun=1; }
    if(sameRun>2){ s=-s; sameRun=1; }       /* не более двух подряд в одну сторону */
    lastBranchSide=s;return s;}

  function scheduleNextSpawn(from){
    nextSpawnAt=from+CH*(SPAWN_GAP_MIN+rng()*(SPAWN_GAP_MAX-SPAWN_GAP_MIN));}

  function trySpawnBranch(){
    if(revealIndex<nextSpawnAt) return;
    var originIdx=Math.round(revealIndex-SPAWN_LAG_PX);
    if(originIdx<18) return;
    scheduleNextSpawn(revealIndex);
    var op=fullPath[originIdx];
    for(var ni=0;ni<branches.length;ni++){
      var nq=fullPath[branches[ni].originIdx];
      if(!nq) continue;
      if(Math.hypot(op.x-nq.x,op.y-nq.y)<CH*0.042) return;
    }
    if(branches.length>=MAX_BRANCHES) return;
    var previousSide=lastBranchSide,previousRun=sameRun;
    var preferred=pickBranchSide(),bside=preferred,pts=null;
    // A crowded first direction need not leave a long bare section: try a few
    // shapes, then the other side, keeping the same attachment protections.
    for(var attempt=0;attempt<6;attempt++){
      bside=attempt<3?preferred:-preferred;
      if(bside===previousSide&&previousRun>=2) continue;
      var candidate=buildBranchPath(originIdx,bside,false);
      if(leafSpaceAvailable(candidate,leafAngleOf(candidate,bside,false),false)){
        pts=candidate;break;
      }
    }
    if(!pts){lastBranchSide=previousSide;sameRun=previousRun;return;}
    lastBranchSide=bside;sameRun=bside===previousSide?previousRun+1:1;
    var minY=Infinity;
    pts.forEach(function(pt){if(pt.y<minY)minY=pt.y;});
    branches.push({pts:pts,originIdx:originIdx,revealIndex:0,revealF:0,topY:minY,appear:0,age:0,birthTipY:fullPath[revealIndex].y,leaf:0,leafT:0,bside:bside,mass:0,front:false,lenBoost:1,ph:0,hold:false,leafAng:leafAngleOf(pts,bside,false)});
  }

  /* Additional shoots grow on older stem sections. */
  function stemCurvature(idx){
    var lo=Math.max(0,idx-Math.round(CH*0.05)), hi=Math.min(fullPath.length-1,idx+Math.round(CH*0.05));
    if(hi-lo<20) return 0;
    var a=fullPath[lo],b=fullPath[idx],c=fullPath[hi];
    var a1=Math.atan2(b.y-a.y,b.x-a.x), a2=Math.atan2(c.y-b.y,c.x-b.x);
    var d=a2-a1;
    while(d>Math.PI)d-=Math.PI*2;
    while(d<-Math.PI)d+=Math.PI*2;
    return Math.abs(d);}

  function spawnCenterBranch(originIdx,cside){
    if(branches.length>=MAX_BRANCHES||originIdx<18||originIdx>=revealIndex) return;
    if(stemCurvature(originIdx)>0.42) return;        /* на крутом изгибе не сажаем */
    /* соседей проверяем по реальному расстоянию на экране, а не по длине стебля:
       на крутом изгибе узлы сближаются, хотя по стеблю разнесены нормально */
    var o=fullPath[originIdx];
    // Front branches share space with side branches, but not with each other.
    var need;
    for(var i=0;i<branches.length;i++){
      var q=fullPath[branches[i].originIdx];
      if(!q) continue;
      need=CH*(branches[i].front?0.045:0.018);
      if(Math.hypot(o.x-q.x,o.y-q.y)<need) return;
    }
    var pts=buildBranchPath(originIdx,cside,true);
    if(!leafSpaceAvailable(pts,leafAngleOf(pts,cside,true),true)) return;
    var minY=Infinity;
    pts.forEach(function(pt){if(pt.y<minY)minY=pt.y;});
    branches.push({pts:pts,originIdx:originIdx,revealIndex:0,revealF:0,topY:minY,appear:0,age:0,birthTipY:fullPath[revealIndex].y,
      leaf:0,leafT:0,bside:cside,mass:0,front:true,lenBoost:1,ph:0,hold:false,
      leafAng:leafAngleOf(pts,cside,true)});}


  // Reserve a mature leaf's silhouette, including for a dormant front branch.
  // All leaves reserve room for their mature blades and visible connections.
  function leafEnvelope(pts,angle){
    var tip=pts[pts.length-1],R=CH*LEAF_FRAC*LEAF_LARGE*(1+OLD_LEAF_BOOST);
    var a=R*1.08,b=R*0.64,ca=Math.cos(angle),sa=Math.sin(angle),out=[];
    for(var i=0;i<12;i++){
      var t=i*Math.PI/6,x=R*1.025+a*Math.cos(t),y=b*Math.sin(t);
      out.push({x:tip.x+ca*x-sa*y,y:tip.y+sa*x+ca*y});
    }
    return out;
  }
  function envelopesOverlap(a,b){
    for(var shape=0;shape<2;shape++){
      var poly=shape?b:a;
      for(var i=0;i<poly.length;i++){
        var p=poly[i],q=poly[(i+1)%poly.length],nx=p.y-q.y,ny=q.x-p.x;
        var amin=Infinity,amax=-Infinity,bmin=Infinity,bmax=-Infinity;
        for(var j=0;j<a.length;j++){var d=a[j].x*nx+a[j].y*ny;amin=Math.min(amin,d);amax=Math.max(amax,d);}
        for(var j=0;j<b.length;j++){var d=b[j].x*nx+b[j].y*ny;bmin=Math.min(bmin,d);bmax=Math.max(bmax,d);}
        if(amax<bmin||bmax<amin) return false;
      }
    }
    return true;
  }
  function leafCoversPetiole(leaf,pts){
    var pad=CH*0.004;
    for(var i=0;i<pts.length-1;i+=4){
      // Protect the root and leaf base; the middle of a petiole may be occluded.
      if(i>=pts.length*0.38&&i<pts.length*0.75) continue;
      var a=pts[i],b=pts[Math.min(pts.length-1,i+4)];
      var dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy)||1;
      var nx=-dy/len*pad,ny=dx/len*pad;
      var corridor=[{x:a.x+nx,y:a.y+ny},{x:b.x+nx,y:b.y+ny},
                    {x:b.x-nx,y:b.y-ny},{x:a.x-nx,y:a.y-ny}];
      if(envelopesOverlap(leaf,corridor)) return true;
    }
    return false;
  }
  function leafSpaceAvailable(pts,angle,front){
    var candidate=leafEnvelope(pts,angle);
    for(var i=0;i<branches.length;i++){
      var other=branches[i];
      var otherLeaf=leafEnvelope(other.pts,other.leafAng);
      // Blade overlap is intentional; keep only the connections readable.
      // Neither leaf may hide the other leaf's root or connecting petiole.
      if(leafCoversPetiole(candidate,other.pts)||leafCoversPetiole(otherLeaf,pts)) return false;
    }
    return true;
  }

  function fillLowerFoliage(){
    if(branches.length>=MAX_BRANCHES) return;
    var extra=branches.filter(function(b){return b.front;}).length;
    if(extra>=MAX_LOWER_BRANCHES) return;
    var parents=branches.slice();
    for(var i=0;i<parents.length;i++){
      var b=parents[i];
      if(b.front) continue;
      // Two bounded stages of side growth on an aging plant segment (60 Hz steps).
      var stage=b.age>=180?2:b.age>=105?1:0;
      if((b.extraStage||0)>=stage) continue;
      b.extraStage=(b.extraStage||0)+1;
      var side=b.extraStage===1?-b.bside:b.bside;
      // Try a few nearby sites once; never keep spawning endlessly at a node.
      for(var j=0;j<3;j++){
        var offset=(0.030+j*0.012)*(b.extraStage===1?-1:1);
        var count=branches.length;
        spawnCenterBranch(b.originIdx+Math.round(CH*offset),side);
        if(branches.length>count) break;
      }
      return; // Bound geometry work to one parent per simulation step.
    }
  }

  function leafColorPhase(b){
    // World coordinates: neither camera movement nor elapsed time ages the color.
    // Each extra shoot starts its own color cycle, even on an old stem section.
    var tip=fullPath[revealIndex];
    var advance=Math.max(0,(b.birthTipY-tip.y)/CH);
    if(advance<=LEAF_COLOR_STOPS[0]) return 0;
    for(var i=0;i<LEAF_COLOR_STOPS.length-1;i++){
      if(advance<LEAF_COLOR_STOPS[i+1]){
        var t=(advance-LEAF_COLOR_STOPS[i])/(LEAF_COLOR_STOPS[i+1]-LEAF_COLOR_STOPS[i]);
        return (i+t)/(LEAF_COLOR_STOPS.length-1);
      }
    }
    return 1;
  }

  function branchAppearance(b,age){
    // Young blade opens by 1.35 seconds; mature size is reached at 4 seconds.
    var maturity=Math.max(0,Math.min(1,(age-81)/159));
    maturity=maturity*maturity*(3-2*maturity);
    var oldAge=Math.max(0,Math.min(1,(age-240)/120));
    oldAge=oldAge*oldAge*(3-2*oldAge);
    var duration=b.front?30:36;
    var reach=Math.max(0,Math.min(1,age/duration));
    var f=reach*reach*(3-2*reach);
    var leafT=Math.max(0,Math.min(1,(age-duration)/45));
    return {revealF:(b.pts.length-1)*f,revealIndex:Math.floor((b.pts.length-1)*f),
      appear:Math.min(1,age/30),ph:leafColorPhase(b),
      lenBoost:(LEAF_SMALL+(LEAF_LARGE-LEAF_SMALL)*maturity)*(1+OLD_LEAF_BOOST*oldAge),
      leafT:leafT,leaf:leafT*leafT*(3-2*leafT)};
  }

  function resetState(){
    rng=mulberry32((Date.now()%1000000)+Math.floor(Math.random()*1000));
    fullPath=[];revealIndex=0;revealAccum=0;grownPx=0;
    branches=[];drawStart=0;cameraY=0;cameraActive=false;segmentCount=0;
    lastBranchSide=rng()>0.5?1:-1;waveSign=rng()>0.5?1:-1;sideMass=[0,0];sameRun=0;
    witherT=0;
    scheduleNextSpawn(0);
    extendMainPath();}

  /* ---- увядание ---- */
  /* ---- распад в прах ---- */


  function dryEase(t){t=Math.max(0,Math.min(1,t));return t*t*(3-2*t);}
  function dryNoise(seed){var n=Math.sin(seed*12.9898+78.233)*43758.5453;return n-Math.floor(n);}
  function dryAngleDelta(a,b){return Math.atan2(Math.sin(b-a),Math.cos(b-a));}
  function droopStem(pts,t){
    if(pts.length<2) return pts;
    var n=pts.length,span=Math.min(n-1,CH*0.27),start=n-1-span;
    var tip=pts[n-1],prev=pts[Math.max(0,n-24)];
    var side=tip.x>=prev.x?1:-1;
    var amount=dryEase((t-0.04)/0.86),out=[{x:pts[0].x,y:pts[0].y}];
    for(var i=1;i<n;i++){
      var p=Math.max(0,(i-start)/span);
      var crease=dryEase((t-0.25)/0.70);
      var wave=Math.asin(Math.sin(i*0.095))*0.13+Math.asin(Math.sin(i*0.043+1.7))*0.09;
      // Small late fold of the last 45 world units; preserve the main bend.
      var tipSpan=Math.min(span,CH*0.065);
      var tipP=Math.max(0,(i-(n-1-tipSpan))/tipSpan);
      var tipFold=side*0.48*tipP*tipP*dryEase((t-0.30)/0.65);
      var rot=side*1.75*p*p*amount+tipFold+wave*crease*Math.min(1,i/24);
      var dx=pts[i].x-pts[i-1].x,dy=pts[i].y-pts[i-1].y;
      out.push({x:out[i-1].x+dx*Math.cos(rot)-dy*Math.sin(rot),
                y:out[i-1].y+dx*Math.sin(rot)+dy*Math.cos(rot)});
    }
    return out;
  }

  function startDry(){
    var visible=fullPath.slice(drawStart,revealIndex+1);
    var matured=Math.min(1,grownPx/(CH*3));
    dryStem={pts:visible.slice(),wTip:CH*0.0034,wBase:CH*0.019*(1+matured),span:CH*1.7};
    dryBranches=branches.map(function(b){
      b=branchPose(b);
      return {pts:branchVisible(b),ai:b.originIdx-drawStart,leaf:b.leaf,bside:b.bside,lenBoost:b.lenBoost,leafAng:b.leafAng,front:b.front,appear:b.appear,color:phaseLeafCss(b.ph),drySeed:dryNoise(b.pts[0].x*0.13+b.pts[0].y*0.17)};
    });
    witherT=0;dryHold=0;}

  function updateDry(){
    if(witherT<1){
      witherT=Math.min(1,witherT+FIXED_STEP/WITHER_DURATION_SECONDS);
      if(witherT>1-1e-9) witherT=1;
    }
    else dryHold+=FIXED_STEP;
  }

  function drawDry(){
    if(!dryStem) return;
    var wt=Math.min(1,witherT+(witherT<1?Math.max(0,stepAccum)/WITHER_DURATION_SECONDS:0));
    var colorT=dryEase(wt),cs=droopStem(dryStem.pts,wt),leafList=[];
    ctx.save();ctx.translate(0,-cameraY);
    function drawDryBranches(front){
      var bw=CH*0.0044*(1-colorT*0.30),bt=CH*0.0016*(1-colorT*0.18);
      dryBranches.forEach(function(b){
        if(b.front!==front||!b.pts.length) return;
        var ai=Math.max(0,Math.min(cs.length-1,b.ai));
        var root=cs[ai],original=b.pts[0];
        var lo=Math.max(0,ai-3),hi=Math.min(cs.length-1,ai+3);
        var oldAng=Math.atan2(dryStem.pts[hi].y-dryStem.pts[lo].y,dryStem.pts[hi].x-dryStem.pts[lo].x);
        var newAng=Math.atan2(cs[hi].y-cs[lo].y,cs[hi].x-cs[lo].x);
        var stemTurn=dryAngleDelta(oldAng,newAng);
        var seed=b.drySeed,pace=dryNoise(seed*81+3);
        var delay=0.02+0.23*seed,finish=0.70+0.28*pace;
        var sag=dryEase((wt-delay)/(finish-delay));
        var target=b.bside>0?0.70+0.60*pace:Math.PI-0.70-0.60*pace;
        // Some blades hang almost along the local stem, others stay farther out.
        var downward=newAng+Math.PI;
        if(Math.sin(downward)<0) downward+=Math.PI;
        if(seed>0.62) target=downward+(b.bside>0?-1:1)*(0.08+0.16*pace);
        var rotation=stemTurn+dryAngleDelta(b.leafAng+stemTurn,target)*sag;
        var co=Math.cos(rotation),sn=Math.sin(rotation);
        var wrinkle=dryEase((wt-0.22-0.16*pace)/(0.76-0.16*pace));
        var dp=b.pts.map(function(p,index){var x=p.x-original.x,y=p.y-original.y;
          var u=index/Math.max(1,b.pts.length-1);
          var kink=Math.sin(Math.PI*u)*Math.sin(2*Math.PI*u+seed*3)*CH*0.0025*wrinkle;
          return {x:root.x+x*co-y*sn-sn*kink,y:root.y+x*sn+y*co+co*kink};});
        var bendTurn=0;
        if(dp.length>1){
          var last=dp.length-1;
          var oldTip=Math.atan2(b.pts[last].y-b.pts[last-1].y,b.pts[last].x-b.pts[last-1].x)+rotation;
          var newTip=Math.atan2(dp[last].y-dp[last-1].y,dp[last].x-dp[last-1].x);
          bendTurn=dryAngleDelta(oldTip,newTip);
        }
        ctx.save();ctx.globalAlpha=b.appear;
        drawPath(dp,lerpC(branchColor,deadBranch,colorT),bw,bt,0.4+b.appear*0.6);
        ctx.restore();
        var leaf=Object.assign({},b,{leafAng:b.leafAng+rotation+bendTurn,widthScale:1-(0.28+seed*0.26)*sag,dryFold:wrinkle*(0.65+seed*0.35)});
        leafList.push({b:leaf,pts:dp,sag:sag});
      });
    }
    drawDryBranches(false);
    drawAgedStem(cs,lerpC(stemColor,deadStem,colorT),dryStem.wTip*(1-colorT*0.15),
      dryStem.wBase*(1-colorT*0.22),dryStem.span);
    drawDryBranches(true);
    leafList.forEach(function(f){
      drawRoundLeaf(f.pts,f.b.leaf*(1-f.sag*0.10),
        lerpC(f.b.color.match(/\d+/g).map(Number),deadBranch,colorT),
        lerpC([67,111,35],[110,87,51],colorT),f.b);
    });
    drawBud(cs,dryEase((wt-0.02)/0.80));
    ctx.restore();
  }

  function drawAgedStem(pts,color,wTip,wBase,ageSpan){
    if(pts.length<2) return;
    ctx.strokeStyle=color;ctx.lineCap='round';ctx.lineJoin='round';
    var n=pts.length,d=wBase-wTip;
    for(var i=1;i<n;i++){
      var r0=Math.min(1,(n-i)/ageSpan),r1=Math.min(1,(n-1-i)/ageSpan);
      ctx.lineWidth=wTip+d*((r0*r0*r0)+(r1*r1*r1))*0.5;
      ctx.beginPath();ctx.moveTo(pts[i-1].x,pts[i-1].y);ctx.lineTo(pts[i].x,pts[i].y);ctx.stroke();
    }}

  function phaseLeafCss(ph){
    var progress=Math.max(0,Math.min(1,ph||0))*(LEAF_COLORS.length-1);
    var index=Math.min(LEAF_COLORS.length-2,Math.floor(progress));
    var t=progress-index;
    t=t*t*(3-2*t);
    return lerpC(LEAF_COLORS[index],LEAF_COLORS[index+1],t);
  }

  function branchPose(b){
    var root=b.pts[0],sy=(root.y-cameraY)/CH;
    var spread=Math.max(0,Math.min(1,(sy-0.52)/0.36));
    if(spread===0) return b;
    spread=spread*spread*(3-2*spread);
    var target=b.bside>0?-30*Math.PI/180:-150*Math.PI/180;
    var angle=lerpAngle(b.leafAng,target,spread),delta=angle-b.leafAng;
    var ca=Math.cos(delta),sa=Math.sin(delta);
    var pts=b.pts.map(function(p){
      var x=p.x-root.x,y=p.y-root.y;
      return {x:root.x+x*ca-y*sa,y:root.y+x*sa+y*ca};
    });
    return Object.assign({},b,{pts:pts,leafAng:angle});
  }

  function branchTopBound(b){
    var pose=branchPose(b),top=Infinity;
    pose.pts.forEach(function(p){top=Math.min(top,p.y);});
    if(pose.leaf>0){
      var pts=branchVisible(pose),tip=pts[pts.length-1];
      var R=CH*LEAF_FRAC*pose.leaf*pose.lenBoost;
      // Conservative bounds of all leaf Bezier control points, including width.
      var leafTop=tip.y+Math.min(0,Math.sin(pose.leafAng)*R*2.05*1.06)
                        -Math.abs(Math.cos(pose.leafAng))*R*0.80*1.05;
      top=Math.min(top,leafTop);
    }
    return top-CH*0.003; // Include the petiole's stroke width.
  }

  function branchVisible(b){
    var i=b.revealIndex;
    var out=b.pts.slice(0,i+1);
    var frac=b.revealF===undefined?0:b.revealF-i;
    if(frac>0.001&&i+1<b.pts.length){
      var a=b.pts[i],c=b.pts[i+1];
      out.push({x:a.x+(c.x-a.x)*frac,y:a.y+(c.y-a.y)*frac});
    }
    return out;}

  function drawPath(pts,color,wBase,wTip,scaleMul){
    if(pts.length<2) return;
    ctx.strokeStyle=color;ctx.lineCap='round';ctx.lineJoin='round';
    var n=pts.length;
    for(var i=1;i<n;i++){
      var t0=(i-1)/(n-1),t1=i/(n-1);
      ctx.lineWidth=(((wBase+(wTip-wBase)*t0)+(wBase+(wTip-wBase)*t1))/2)*scaleMul;
      ctx.beginPath();ctx.moveTo(pts[i-1].x,pts[i-1].y);ctx.lineTo(pts[i].x,pts[i].y);ctx.stroke();
    }}

  function drawTeardrop(x,y,rot,len,wid){
    ctx.save();ctx.translate(x,y);ctx.rotate(rot);
    ctx.beginPath();ctx.moveTo(0,0);
    ctx.bezierCurveTo(wid*1.15,-len*0.26,wid*0.96,-len*0.74,wid*0.06,-len);
    ctx.bezierCurveTo(-wid*0.74,-len*0.70,-wid*0.86,-len*0.26,0,0);
    ctx.closePath();ctx.fill();ctx.restore();}

  /* ---- тройчатый лист на кончике ветки ---- */
  var LEAF_FRAC=0.036;            /* размер листа, доли высоты экрана */
  var leafCss='rgb(103,163,44)', leafVein='rgb(67,111,35)';

  function leafBlade(bx,by,ang,R,color,vein,widthScale,dryFold,drySeed){
    ctx.save();ctx.translate(bx,by);ctx.rotate(ang);
    var L=R*2.55,W=R*0.36*(widthScale===undefined?1:widthScale);
    var maturity=dryEase(Math.max(0,Math.min(1,(R/CH-0.010)/0.025)));
    var fold=dryFold||0,seed=drySeed||0;
    function point(u,side){
      var center=W*0.12*Math.sin(u*Math.PI*0.75);
      // Slender elongated blade: rounded sides, about four lengths per width.
      var shape=Math.pow(Math.sin(Math.PI*u),0.85)*(1-0.22*u);
      var notch=0;
      [0.24,0.40,0.56].forEach(function(at,i){
        var d=u-(at+(side>0?0.015:0));
        var support=d<0?0.012:0.055;
        if(Math.abs(d)<support) notch+=0.09*(1-i*0.18)*(1-Math.abs(d)/support);
      });
      var width=W*shape*(1-maturity*notch)*(side<0?1:0.94);
      var y=center+side*width;
      var bend=W*fold*(0.32*Math.sin(u*Math.PI*2.5+seed*2)*Math.sin(u*Math.PI)
        +0.27*Math.max(0,(u-0.72)/0.28)*(seed>0.5?1:-1));
      return {x:L*u,y:y*(1-fold*0.20*(0.5+0.5*Math.sin(u*23+seed*9)))+bend};
    }
    ctx.fillStyle=color;ctx.beginPath();
    function edgePoints(side){
      var out=[];
      for(var i=0;i<=120;i++)out.push(point(i/120,side));
      return out;
    }
    var outline=edgePoints(-1).concat(edgePoints(1).reverse());
    outline.forEach(function(p,i){if(i===0)ctx.moveTo(p.x,p.y);else ctx.lineTo(p.x,p.y);});
    ctx.closePath();ctx.fill();
    if(R>CH*0.010){
      ctx.strokeStyle=vein;ctx.lineWidth=Math.max(0.55,R*0.035);ctx.lineCap='round';ctx.beginPath();
      for(var k=0;k<=24;k++){var v=point(0.05+0.91*k/24,0);if(k===0)ctx.moveTo(v.x,v.y);else ctx.lineTo(v.x,v.y);}
      ctx.stroke();
      if(fold>0){
        ctx.globalAlpha*=fold*0.5;
        [0.34,0.62].forEach(function(u,i){var a=point(u,0),b=point(u+0.11,i===0?-0.7:0.7);
          ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();});
      }
    }
    ctx.restore();
  }

  function leafAngleOf(pts,bside,center){
    var n=pts.length,a=pts[n-1],b=pts[Math.max(0,n-2)];
    return Math.atan2(a.y-b.y,a.x-b.x);
  }

  function drawRoundLeaf(pts,grow,color,vein,rndSeed){
    if(grow<=0||pts.length<2) return;
    var n=pts.length;
    var tip=pts[n-1];
    var ang=(rndSeed&&rndSeed.leafAng!==undefined)?rndSeed.leafAng:leafAngleOf(pts,rndSeed&&rndSeed.bside,false);

    var R=CH*LEAF_FRAC*grow*(rndSeed&&rndSeed.lenBoost||LEAF_SMALL);
    ctx.save();ctx.globalAlpha=1;
    leafBlade(tip.x,tip.y,ang,R,color,vein,rndSeed&&rndSeed.widthScale,rndSeed&&rndSeed.dryFold,rndSeed&&rndSeed.drySeed);ctx.restore();
}

  // Flat silhouette halo: one translucent fill, no blur or overlapping alpha.
  var BUD_HALO_ENABLED=true;
  var BUD_HALO_SCALE=1.45;
  function drawBudHalo(tip,ang,sc,t){
    if(!BUD_HALO_ENABLED||t>=1) return;
    var pulse=0.125+0.025*Math.sin(performance.now()*Math.PI*2/3200);
    ctx.save();
    ctx.globalAlpha*=pulse*(1-t);
    ctx.fillStyle=lerpC(budColor,deadBud,0);
    ctx.translate(tip.x,tip.y);ctx.rotate(ang);
    ctx.translate(0,-11*sc);ctx.scale(BUD_HALO_SCALE,BUD_HALO_SCALE);ctx.translate(0,11*sc);
    ctx.beginPath();
    function petal(rot,len,wid){
      ctx.save();ctx.rotate(rot);
      ctx.moveTo(0,0);
      ctx.bezierCurveTo(wid*1.15,-len*0.26,wid*0.96,-len*0.74,wid*0.06,-len);
      ctx.bezierCurveTo(-wid*0.74,-len*0.70,-wid*0.86,-len*0.26,0,0);
      ctx.closePath();ctx.restore();
    }
    // Trace every petal in the same winding direction for a solid union.
    petal(-0.56-t*0.5,20*sc,5*sc);
    petal(0.56+t*0.5,20*sc,5*sc);
    petal(-0.29,23.5*sc,5.2*sc);
    petal(0.29,23.5*sc,5.2*sc);
    petal(0,26*sc,6.4*sc);
    ctx.fill();ctx.restore();
  }

  // Four overlapping side lobes plus the central front lobe form a tight bud.
  function drawBudBaseLeaves(sc){
    ctx.fillStyle=branchCss;
    drawTeardrop(0,2*sc,-1.05,9*sc,-2*sc);
    drawTeardrop(0,2*sc,1.10,8*sc,1.8*sc);
  }

  function drawCalyx(sc,open,pitch,wilt){
    var lobes=[[-0.56,20,5.0,-2.25],[0.56,20,5.0,2.25],[-0.29,23.5,5.2,-1.15],[0.29,23.5,5.2,1.15]];
    lobes.forEach(function(lobe,i){
      var progress=dryEase(Math.max(0,Math.min(1,(open-i*0.025)/(0.82-i*0.025))));
      ctx.save();ctx.scale(1,1+(pitch-1)*progress);
      ctx.fillStyle=lerpC(budColor,wilt?deadBud:[77,138,30],wilt?wilt*0.16:progress*0.6);
      drawTeardrop(0,0,lobe[0]+(lobe[3]-lobe[0])*progress,lobe[1]*sc,lobe[2]*sc*(lobe[0]<0?-1:1));
      ctx.restore();
    });
  }

  function drawFrontCalyx(sc,open,pitch,wilt){
    // A fixed-length central lobe folds toward the viewer, never sideways.
    var fold=dryEase(Math.max(0,Math.min(1,(open-0.18)/0.70)));
    var projected=Math.cos(fold*Math.PI*0.91);
    var length=26*sc,width=6.4*sc;
    ctx.save();
    // The growing corolla covers the folded lobe; no alpha fade or size loss.
    var cover=CH*0.045*dryEase(Math.max(0,Math.min(1,(open-0.48)/0.42)));
    if(cover>0){
      ctx.beginPath();ctx.rect(-CH,-CH,CH*2,CH*2);
      ctx.ellipse(0,0,cover,cover*pitch,0,0,Math.PI*2);ctx.clip('evenodd');
    }
    ctx.fillStyle=lerpC(budColor,wilt?deadBud:[77,138,30],wilt?wilt*0.16:fold*0.6);
    ctx.beginPath();ctx.moveTo(0,0);
    ctx.bezierCurveTo(width*1.15,-length*0.26*projected,width*0.96,-length*0.74*projected,width*0.06,-length*projected);
    ctx.bezierCurveTo(-width*0.74,-length*0.70*projected,-width*0.86,-length*0.26*projected,0,0);
    ctx.closePath();ctx.fill();ctx.restore();
  }

  function drawBud(pts,t){
    if(pts.length<3) return;
    var tip=pts[pts.length-1],prev=pts[Math.max(0,pts.length-24)];
    var ang=Math.atan2(tip.y-prev.y,tip.x-prev.x)+Math.PI/2;
    var sc=CH*0.0018;
    if(mode!=='withering') drawBudHalo(tip,ang,sc,0);
    // The same five lobes in every state; the wilted stem supplies the droop.
    ctx.save();ctx.translate(tip.x,tip.y);ctx.rotate(ang);
    drawBudBaseLeaves(sc);drawCalyx(sc,0,1,t);drawFrontCalyx(sc,0,1,t);
    ctx.restore();
  }

  /* ---- расцветание (выигрыш) ---- */
  var BLOOM_FRAMES=150;
  // Flat aster: staggered rows of narrow petals, dark outside and light inside.
  var ASTER_LAYERS=[
    {count:22,length:1.38,width:0.145,delay:0.00,colors:['#8538A5','#9843B4']},
    {count:19,length:1.12,width:0.150,delay:0.12,colors:['#B354C4','#C468D0']},
    {count:15,length:0.84,width:0.135,delay:0.24,colors:['#D47DDA','#E395E4']}
  ];
  var coreColor=[240,196,80];

  function captureBloom(){
    var visible=fullPath.slice(drawStart,revealIndex+1);
    var matured=Math.min(1,grownPx/(CH*3));
    bloomStem={pts:visible.slice(),wTip:CH*0.0034,wBase:CH*0.019*(1+matured),span:CH*1.7};
    var n=visible.length||1;
    bloomBranches=branches.map(function(b){
      b=branchPose(b);
      var ai=b.originIdx-drawStart;
      return {pts:branchVisible(b),leaf:b.leaf,bside:b.bside,lenBoost:b.lenBoost,leafAng:b.leafAng,front:b.front,appear:b.appear,color:phaseLeafCss(b.ph),ai:ai};
    });
  }

  var BLOOM_COAST_SECONDS=1.1;
  function startBloom(){captureBloom();bloomT=0;bloomHold=0;}

  // Keep the real generated path and natural leaf development during deceleration.
  function bloomPose(t){
    return {pts:bloomStem.pts,branches:bloomBranches,
      open:Math.min(1,t/0.36),offset:0,sway:0};
  }

  // Fixed petal azimuths: a cupped profile opens as the head lifts toward us.
  // Opaque green sepals fold below the corolla; no crossfade or radial fan.
  function drawFlower(x,y,ang,open){
    var sc=CH*0.0018,R=CH*0.045;
    var lift=dryEase(Math.max(0,(open-0.08)/0.92));
    var spread=dryEase(open);
    var lean=-Math.sin(ang)*0.13*lift;
    var hx=Math.sin(lean)*9*sc,hy=-9*sc*lift;
    var pitch=0.30+0.60*lift;
    drawBudHalo({x:x,y:y},ang,sc,spread);
    ctx.save();ctx.translate(x,y);ctx.rotate(ang);
    ctx.strokeStyle=stemCss;ctx.lineWidth=CH*0.0034;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(0,0);ctx.bezierCurveTo(0,hy*0.35,hx*0.3,hy*0.8,hx,hy);ctx.stroke();
    ctx.translate(hx,hy);ctx.rotate(lean);
    // Folded petals have height above the head, then flatten into its disc.
    function petal(layer,row,i){
      var a=i/layer.count*Math.PI*2+row*0.17;
      var u=dryEase(Math.max(0,Math.min(1,(open-layer.delay*0.38)/(1-layer.delay*0.38))));
      var emerge=dryEase(Math.min(1,open/0.27));
      var L=R*layer.length*(1+0.045*Math.sin(i*2.4+row*1.7))*emerge;
      var W=R*layer.width*(0.20+0.80*u)*emerge;
      var spreadAngle=0.10+(Math.PI/2-0.10)*u;
      function point(r,w){
        var radial=r*Math.sin(spreadAngle);
        var height=r*Math.cos(spreadAngle);
        return [Math.sin(a)*radial+Math.cos(a)*w,
          -Math.cos(a)*radial*pitch+Math.sin(a)*w*pitch-height*Math.sqrt(1-pitch*pitch)];
      }
      var p0=point(R*0.04*emerge,-W*0.18),p1=point(L*0.38,-W),p2=point(L*0.88,-W*0.66),
        tip=point(L,0),p3=point(L*0.91,W*0.66),p4=point(L*0.42,W),p5=point(R*0.04*emerge,W*0.18);
      ctx.fillStyle=layer.colors[i%2];ctx.beginPath();ctx.moveTo(p0[0],p0[1]);
      ctx.bezierCurveTo(p1[0],p1[1],p2[0],p2[1],tip[0],tip[1]);
      ctx.bezierCurveTo(p3[0],p3[1],p4[0],p4[1],p5[0],p5[1]);ctx.closePath();ctx.fill();
    }
    function petals(front){
      ASTER_LAYERS.forEach(function(layer,row){
        for(var i=0;i<layer.count;i++){
          var a=i/layer.count*Math.PI*2+row*0.17;
          if((Math.cos(a)<0)===front)petal(layer,row,i);
        }
      });
    }
    // Calyx stays behind the whole corolla, including the far-side petals.
    drawBudBaseLeaves(sc);
    drawCalyx(sc,open,pitch);
    // The opaque overlapping petal bases cover the calyx as the head opens.
    var baseRadius=R*dryEase(Math.max(0,(open-0.18)/0.82));
    ctx.fillStyle=ASTER_LAYERS[0].colors[0];ctx.beginPath();
    ctx.ellipse(0,0,baseRadius,baseRadius*pitch,0,0,Math.PI*2);ctx.fill();
    petals(false);
    var coreR=R*0.245*dryEase(Math.max(0,(open-0.25)/0.75));
    ctx.save();ctx.scale(1,pitch);
    ctx.fillStyle='rgb('+coreColor.join(',')+')';ctx.beginPath();ctx.arc(0,0,coreR,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#FFE39A';
    for(var j=0;j<7;j++){
      var a=j*Math.PI*2/7;ctx.beginPath();ctx.arc(Math.cos(a)*coreR*0.62,Math.sin(a)*coreR*0.62,coreR*0.10,0,Math.PI*2);ctx.fill();
    }
    ctx.restore();
    petals(true);
    drawFrontCalyx(sc,open,pitch);
    ctx.restore();
  }

  function drawBloom(){
    var t=Math.min(1,bloomT+Math.max(0,stepAccum)/FIXED_STEP/BLOOM_FRAMES);
    var pose=bloomPose(t),pts=pose.pts,open=pose.open;
    ctx.save();ctx.translate(0,-cameraY+pose.offset);
    var brW=CH*0.0044,brTip=CH*0.0016;
    function drawBloomBranches(front){pose.branches.forEach(function(b){
      if(b.front!==front) return;
      ctx.save();ctx.globalAlpha=b.appear;
      drawPath(b.pts,branchCss,brW,brTip,0.4+b.appear*0.6);
      ctx.restore();
    });}
    drawBloomBranches(false);
    drawAgedStem(pts,stemCss,bloomStem.wTip,bloomStem.wBase,bloomStem.span);
    drawBloomBranches(true);
    [false,true].forEach(function(front){pose.branches.forEach(function(b){
      if(b.front===front) drawRoundLeaf(b.pts,b.leaf,b.color,leafVein,b);
    });});
    var tip=pts[pts.length-1],prev=pts[Math.max(0,pts.length-24)];
    var ang=Math.atan2(tip.y-prev.y,tip.x-prev.x)+Math.PI/2;
    drawFlower(tip.x,tip.y,ang,open);
    ctx.restore();}

  function draw(){
    ctx.clearRect(0,0,CW,CH);
    if(mode==='blooming'){drawBloom();return;}
    if(mode==='withering'){drawDry();return;}
    if(!fullPath||!fullPath.length) return;
    var stemTip=CH*0.0034;
    var matured=Math.min(1,grownPx/(CH*3));
    var stemBase=CH*0.019*(1+matured);
    var brW=CH*0.0044, brTip=CH*0.0016;
    ctx.save();ctx.translate(0,-cameraY);
    var visible=fullPath.slice(drawStart,revealIndex+1);
    var frontList=[],leafList=[];
    branches.forEach(function(b){
      if(!b.hold) b=Object.assign({},b,branchAppearance(b,Math.max(0,b.age-1+Math.max(0,stepAccum)/FIXED_STEP)));
      var pa=ctx.globalAlpha;ctx.globalAlpha=pa*b.appear;
      if(b.appear<=0||b.hold){ ctx.globalAlpha=pa; return; }
      b=branchPose(b);
      var vis=branchVisible(b);
      if(b.front){ frontList.push({b:b,vis:vis,a:pa*b.appear}); ctx.globalAlpha=pa; return; }
      drawPath(vis,branchCss,brW,brTip,0.4+b.appear*0.6);
      leafList.push({b:b,vis:vis});
      ctx.globalAlpha=pa;
    });
    drawAgedStem(visible,stemCss,stemTip,stemBase,CH*1.7);
    frontList.forEach(function(f){
      var pa=ctx.globalAlpha;ctx.globalAlpha=f.a;
      drawPath(f.vis,branchCss,brW,brTip,1);
      leafList.push({b:f.b,vis:f.vis});
      ctx.globalAlpha=pa;
    });
    leafList.forEach(function(f){drawRoundLeaf(f.vis,f.b.leaf,phaseLeafCss(f.b.ph),leafVein,f.b);});
    drawBud(visible,0);
    ctx.restore();}

  function finishRound(){
    mode='idle';
    actionBtn.disabled=false;
    actionBtn.textContent='Посадить';
    actionBtn.classList.remove('stop');
    resetState();draw();}

  /* ---- цикл ---- */
  function advancePlant(speed,trackGrowth,flowerOpen){
      var before=revealIndex;
      revealAccum+=REVEAL_SPEED*speed;
      while(revealAccum>=1&&revealIndex<fullPath.length-1){revealIndex++;revealAccum-=1;}
      if(trackGrowth) grownPx+=(revealIndex-before)*STEP_PX;
      if(fullPath.length-revealIndex<CH*0.2) extendMainPath();
      trySpawnBranch();
      fillLowerFoliage();
      branches.forEach(function(b){
        b.age+=speed;
        var appearance=branchAppearance(b,b.age);
        Object.assign(b,appearance);
        var nl=b.leaf;
        var nm=nl;
        sideMass[b.bside>0?1:0]+=nm-b.mass;
        b.mass=nm;
        b.leaf=nl;
      });
      var tip=fullPath[revealIndex];
      var desired=tip.y-(CAMERA_TRIGGER_Y+CH*0.028*flowerOpen);
      if(!cameraActive&&desired<0) cameraActive=true;
      if(cameraActive){
        cameraY+=(desired-cameraY)*0.10;
        if(trackGrowth&&cameraY>desired) cameraY=desired;
      }
      branches=branches.filter(function(b){
        if(branchTopBound(b)-cameraY<=CH+8) return true;
        sideMass[b.bside>0?1:0]-=b.mass;
        return false;
      });
      // Keep the attachment of every surviving leaf, even below the viewport.
      var firstAttachment=revealIndex;
      branches.forEach(function(b){firstAttachment=Math.min(firstAttachment,b.originIdx);});
      while(drawStart<firstAttachment&&(fullPath[drawStart].y-cameraY)>CH+60){drawStart++;}
      if(drawStart>2000){
        fullPath.splice(0,drawStart);
        revealIndex-=drawStart;
        nextSpawnAt-=drawStart;
        branches.forEach(function(b){b.originIdx-=drawStart;});
        drawStart=0;
      }
  }

  function updateStep(){
    if(mode==='active'){
      advancePlant(1,true,0);
    } else if(mode==='blooming'){
      var elapsed=bloomT*BLOOM_FRAMES*FIXED_STEP;
      var speed=1-dryEase(elapsed/BLOOM_COAST_SECONDS);
      bloomT=Math.min(1,bloomT+1/BLOOM_FRAMES);
      advancePlant(speed,false,dryEase(bloomT/0.56));
      captureBloom();
      if(bloomT>=1){
        bloomHold++;
        if(bloomHold>=75){finishRound();return;}
      }
      return;
    } else if(mode==='withering'){
      updateDry();
      if(dryHold+1e-9>=WITHER_HOLD_SECONDS){finishRound();return;}
    }
  }

  function tick(now){
    rafId=null;
    if(document.hidden){lastTime=now;return;}
    var elapsed=Math.max(0,(now-lastTime)/1000);lastTime=now;
    // Catch normal frame drops with fixed steps; avoid long blocking catch-ups.
    stepAccum+=Math.min(elapsed,0.25);
    while(stepAccum+1e-9>=FIXED_STEP&&mode!=='idle'){
      stepAccum-=FIXED_STEP;
      updateStep();
    }
    draw();
    if(mode!=='idle') rafId=requestAnimationFrame(tick);
  }

  actionBtn.addEventListener('click',function(){
    if(mode!=='active'&&mode!=='idle') return;
    stopLoop();
    if(mode==='active'){
      mode='blooming';
      startBloom();
      actionBtn.disabled=true;
      actionBtn.textContent='Собрано';
      actionBtn.classList.remove('stop');
      startLoop();
    } else if(mode==='idle'){
      resetState();mode='active';
      actionBtn.textContent='Собрать';
      actionBtn.classList.add('stop');
      startLoop();
    }
  });

  var loseBtn=document.getElementById('lose');
  loseBtn.addEventListener('click',function(){
    if(mode!=='active') return;
    stopLoop();
    witherT=0;mode='withering';
    startDry();
    actionBtn.disabled=true;
    actionBtn.textContent='Сгорело';
    actionBtn.classList.remove('stop');
    startLoop();
  });

  // This visual prototype pauses in the background; no betting round exists yet.
  document.addEventListener('visibilitychange',function(){
    var now=performance.now();
    if(document.hidden){hiddenAt=now;stopLoop();}
    else if(hiddenAt!==null){
      hiddenAt=null;
      if(mode!=='idle') startLoop();
    }
  });
  window.addEventListener('resize',resize);
  window.addEventListener('orientationchange',function(){setTimeout(resize,250);});
  document.addEventListener('touchmove',function(e){e.preventDefault();},{passive:false});

  var fsBtn=document.getElementById('fs'),fsIcon=document.getElementById('fsIcon');
  var root=document.documentElement;
  var canFs=(document.fullscreenEnabled||document.webkitFullscreenEnabled)&&!!(root.requestFullscreen||root.webkitRequestFullscreen);
  if(!canFs) fsBtn.classList.add('hidden');
  fsBtn.addEventListener('click',function(){
    var active=document.fullscreenElement||document.webkitFullscreenElement;
    if(active){
      if(document.exitFullscreen) document.exitFullscreen();
      else if(document.webkitExitFullscreen) document.webkitExitFullscreen();
    } else {
      if(root.requestFullscreen) root.requestFullscreen().catch(function(){});
      else if(root.webkitRequestFullscreen) root.webkitRequestFullscreen();
    }
  });
  function syncFsIcon(){
    var active=document.fullscreenElement||document.webkitFullscreenElement;
    fsIcon.setAttribute('d',active
      ?'M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5'
      :'M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5');
    setTimeout(resize,120);
  }
  document.addEventListener('fullscreenchange',syncFsIcon);
  document.addEventListener('webkitfullscreenchange',syncFsIcon);

  mode='idle';
  resize();
})();
</script>
</body>
</html>
